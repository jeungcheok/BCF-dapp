<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BCF Wallet — Best Community Faith</title>
  <meta name="description" content="Decentralized community finance on BSC" />
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-card: #131313;
      --bg-card-2: #1a1a1a;
      --bg-elev: #1f1f1f;
      --fg: #ffffff;
      --muted: #9ca3af;
      --muted-2: #6b7280;
      --gold: #fbbf24;
      --gold-2: #f59e0b;
      --gold-3: #d97706;
      --gold-deep: #b45309;
      --gold-soft: rgba(251, 191, 36, 0.1);
      --gold-border: rgba(251, 191, 36, 0.4);
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; min-height: 100vh; padding-bottom: 90px; }
    body { zoom: 0.8; }
    @supports not (zoom: 0.8) {
      body { transform: scale(0.8); transform-origin: top center; width: 125%; }
    }
    a { color: var(--gold); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font-family: inherit; cursor: pointer; }

    /* Top bar */
    .topbar { position: sticky; top: 0; z-index: 50; background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 10px 0; }
    .topbar-inner { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-shield { width: 80px; height: auto; }
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    .btn-connect { background: var(--gold); color: #1a1a00; border: 0; padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; transition: all 0.15s; }
    .btn-connect:hover { background: var(--gold-2); transform: translateY(-1px); }
    .btn-connect:disabled { opacity: 0.5; cursor: not-allowed; }
    .menu-btn { background: transparent; border: 0; color: var(--fg); padding: 8px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
    .menu-btn span { display: block; width: 22px; height: 2px; background: var(--fg); border-radius: 1px; }
    .menu-btn span:nth-child(2) { width: 16px; align-self: flex-end; }
    .menu-btn span:nth-child(3) { width: 22px; }

    /* Container */
    .container { max-width: 1200px; margin: 0 auto; padding: 20px 24px 0; }

    /* Stat cards — gold border */
    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--gold-border); border-radius: 12px; padding: 14px 18px; }
    .stat-label { color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
    .stat-value { font-size: 1.6rem; font-weight: 700; }
    .stat-value .unit { font-size: 0.85rem; color: var(--muted); margin-left: 4px; font-weight: 500; }
    @media (max-width: 768px) { .stat-row { grid-template-columns: 1fr; } }

    /* Hero — Capital Protection (darker yellow) */
    .hero { background: linear-gradient(135deg, #f59e0b 0%, #d97706 60%, #b45309 100%); border-radius: 16px; padding: 20px 24px; position: relative; overflow: hidden; margin-bottom: 16px; }
    .hero::after { content: ""; position: absolute; right: -40px; bottom: -40px; width: 220px; height: 220px; background: radial-gradient(circle, rgba(255,255,255,0.25), transparent 70%); border-radius: 50%; }
    .hero h2 { font-size: 1.4rem; font-weight: 800; color: #0a0a0a; margin-bottom: 14px; }
    .hero-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 14px; position: relative; z-index: 1; }
    .hero-col-label { color: rgba(10,10,10,0.7); font-size: 0.8rem; margin-bottom: 3px; }
    .hero-col-value { color: #0a0a0a; font-size: 1rem; font-weight: 700; }
    .hero-col-value .active { color: #15803d; font-weight: 700; }
    .hero-btns { display: flex; gap: 10px; position: relative; z-index: 1; }
    .btn-dark { background: #0a0a0a; color: var(--gold); border: 0; padding: 9px 20px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; }
    .btn-dark:hover { background: #1f1f1f; }
    .btn-outline-dark { background: transparent; color: #0a0a0a; border: 1.5px solid #0a0a0a; padding: 9px 20px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; }
    .btn-outline-dark:hover { background: rgba(0,0,0,0.1); }
    .btn-gold { background: var(--gold); color: #0a0a0a; border: 0; padding: 11px 24px; border-radius: 8px; font-weight: 700; }
    .btn-gold:hover { background: var(--gold-2); }
    .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-gold.full { width: 100%; padding: 14px; }
    .btn-purchase { background: var(--gold-2); color: #0a0a0a; border: 0; padding: 9px 20px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; }
    .btn-purchase:hover { background: var(--gold-3); }
    .btn-purchase:disabled { opacity: 0.5; cursor: not-allowed; }
    @media (max-width: 768px) { .hero-grid { grid-template-columns: 1fr; } }

    /* Plan cards */
    .plans-label { color: var(--fg); font-size: 0.95rem; margin: 22px 0 14px; max-width: 720px; }
    .plan-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    @media (max-width: 900px) { .plan-row { grid-template-columns: 1fr; } }
    .plan-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; position: relative; }
    .plan-title { color: var(--muted); font-size: 0.78rem; text-align: center; margin-bottom: 6px; }
    .plan-pct { font-size: 2rem; font-weight: 800; display: inline-block; margin-right: 8px; }
    .plan-meta { color: var(--muted); font-size: 0.85rem; }
    .plan-meta-row { display: flex; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
    .plan-meta-row .col-label { color: var(--muted); font-size: 0.7rem; }
    .plan-meta-row .col-value { color: var(--fg); font-size: 0.85rem; font-weight: 600; }
    .plan-amount { color: var(--muted); font-size: 0.78rem; margin-top: 6px; }
    .plan-purchase-btn { position: absolute; right: 14px; top: 18px; }

    /* Notice */
    .notice { padding: 16px 20px; border-radius: 12px; margin: 20px 0; font-size: 0.9rem; }
    .notice-warning { background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; }
    .notice-info { background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.3); color: #93c5fd; }

    /* Bottom nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 14px; z-index: 50; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); background: transparent; border: 0; padding: 6px 12px; font-size: 0.75rem; cursor: pointer; }
    .nav-item.active { color: var(--gold); }
    .nav-item svg { width: 22px; height: 22px; }
    .nav-item:hover { color: var(--gold); }

    /* Page heading */
    .page-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
    .page-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 22px; }

    /* Forms */
    input, select { width: 100%; padding: 12px 14px; background: var(--bg-card-2); border: 1px solid var(--border); border-radius: 8px; color: var(--fg); font-size: 0.95rem; font-family: inherit; }
    input:focus, select:focus { outline: none; border-color: var(--gold); }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    .form-row { margin-bottom: 16px; }
    .pct-row { display: flex; gap: 8px; margin-top: 12px; }
    .pct-btn { background: var(--bg-card-2); border: 1px solid var(--border); color: var(--fg); padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; flex: 1; }
    .pct-btn:hover, .pct-btn.active { background: var(--gold); color: #0a0a0a; border-color: var(--gold); }
    input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; background: var(--bg-card-2); border-radius: 4px; outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: var(--gold); border-radius: 50%; cursor: pointer; border: 2px solid #0a0a0a; }
    input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; background: var(--gold); border-radius: 50%; cursor: pointer; border: 2px solid #0a0a0a; }

    /* Node tier progression — medals */
    .tier-progress { display: flex; align-items: center; gap: 4px; margin: 14px 0; }
    .tier-pip { width: 36px; height: 36px; background: var(--bg-card-2); border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: var(--muted); position: relative; font-weight: 700; }
    .tier-pip.completed { background: var(--gold); color: #0a0a0a; border-color: var(--gold); }
    .tier-pip.active { background: var(--gold-2); color: #0a0a0a; border-color: var(--gold-2); box-shadow: 0 0 12px rgba(251,191,36,0.5); }
    .tier-pip .medal { font-size: 1.4rem; }
    .tier-line { flex: 1; height: 3px; background: var(--border); }
    .tier-line.done { background: var(--gold); }
    .tier-list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }

    /* Misc */
    .loader { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--muted); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .table th { text-align: left; color: var(--muted); font-weight: 500; padding: 12px 8px; border-bottom: 1px solid var(--border); }
    .table td { padding: 12px 8px; border-bottom: 1px solid var(--border); }
    .social-icons { display: flex; gap: 12px; margin-top: 14px; }
    .social-icons a { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-card-2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--fg); }
    .social-icons a:hover { background: var(--gold); color: #0a0a0a; text-decoration: none; }
    .qr-block { background: white; padding: 12px; border-radius: 12px; display: inline-block; }

    /* Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal.open { display: flex; }
    .modal-inner { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; max-width: 480px; width: 100%; }
    .modal h3 { margin-bottom: 16px; font-size: 1.25rem; }
    .modal-foot { display: flex; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

  <!-- App -->

  <!-- Modal -->

  <!-- Bottom nav -->

  <script>
    // ============================================================
    // Config
    // ============================================================
    const CONFIG = {
      chainId: 97,
      chainName: "BSC Testnet",
      rpcUrl: "https://bsc-testnet-rpc.publicnode.com",
      explorer: "https://testnet.bscscan.com",
      addresses: {
        BCFToken:   "0xc3Fb054a7854A999Cf1a034B33D3eB795dc40D3d",
        MockUSDT:   "0x91Cbf7A377c3810720A7265955B3E984197d4aB7",
        Operations: "0x006e3406b667Fdba452ca65187329b73087F151f",
        Investment: "0x8404dc9C918c587B40ed88Db95Ae6C7761DBdB66",
        Node:       "0xDc2bB5fcd40962BafC5ab705cc347D6e19f1b1a8",
        Referral:   "0x5f1F4Bf82C3b0143189cA19d69D57FfC95f7aF1E",
        Insurance:  "0x870C440e16e5D6B578f392eaA8cbEffa1eBd8024",
        Dashboard:  "0xAe984E1e5e1d77B725e0Ad4a9f57D1900aFd8cEb",
      },
      plans: [
        { id: 0, name: "Plan A", monthly: 10, months: 20, min: 100,  ins: 70, label: "Auto Selling" },
        { id: 1, name: "Plan B", monthly: 15, months: 10, min: 500,  ins: 70, label: "Auto Selling" },
        { id: 2, name: "Plan C", monthly: 25, months: 5,  min: 1000, ins: 70, label: "Auto Selling" },
      ],
      // Node tiers with medal icons (used in Node + Network pages)
      tiers: [
        { name: "V2", minU: 500,   shares: 5,   desc: "Purchase a 500U node to attain V2 tier.", type: "medal-bronze" },
        { name: "V3", minU: 1000,  shares: 10,  desc: "Purchase a 1,000U node to attain V3 tier.", type: "medal-gold" },
        { name: "V3 Premium", minU: 5000, shares: 50, desc: "Purchase a 5,000U node to attain V3 tier.\nMarketing Funds: 1,500 USD over 10 Months\nMeal Allowance: 10 USD/person", type: "medal-gold-big" },
        { name: "V4", minU: 10000, shares: 100, desc: "Purchase a 10,000U node to attain V4 tier.\nMarketing Funds: 3,000 USD over 10 Months\nMeal Allowance: 10 USD/person", type: "gem-purple" },
      ],
    };

    // SVG icon helpers — match original 3D medal/gem designs
    function tierIcon(type, size = 36) {
      const s = size;
      if (type === "medal-bronze") {
        // V2: hex bronze medal, no wings
        return `<svg width="${s}" height="${s*1.3}" viewBox="0 0 64 84" fill="none">
          <defs>
            <linearGradient id="bG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="0.5" stop-color="#b45309"/><stop offset="1" stop-color="#7c2d12"/></linearGradient>
            <linearGradient id="bStar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
          </defs>
          <!-- ribbon -->
          <path d="M22 52 L14 84 L32 70 L50 84 L42 52 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.5"/>
          <path d="M22 52 L32 70 L42 52" fill="#991b1b" opacity="0.5"/>
          <!-- hex body (tall hex) -->
          <path d="M32 2 L60 16 L60 42 L32 58 L4 42 L4 16 Z" fill="url(#bG)" stroke="#451a03" stroke-width="1.5"/>
          <!-- inner border -->
          <path d="M32 8 L54 20 L54 40 L32 52 L10 40 L10 20 Z" fill="none" stroke="#fde68a" stroke-width="1" opacity="0.6"/>
          <!-- star -->
          <path d="M32 16 L36 26 L46 26 L38 33 L41 43 L32 36 L23 43 L26 33 L18 26 L28 26 Z" fill="url(#bStar)" stroke="#92400e" stroke-width="0.5"/>
        </svg>`;
      }
      if (type === "medal-gold") {
        // V3: hex gold medal with wings
        return `<svg width="${s}" height="${s*1.3}" viewBox="0 0 80 104" fill="none">
          <defs>
            <linearGradient id="gG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="0.5" stop-color="#f59e0b"/><stop offset="1" stop-color="#92400e"/></linearGradient>
            <linearGradient id="gStar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbeb"/><stop offset="1" stop-color="#fcd34d"/></linearGradient>
            <linearGradient id="gWing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#a16207"/></linearGradient>
          </defs>
          <!-- ribbon -->
          <path d="M30 64 L20 104 L40 88 L60 104 L50 64 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.5"/>
          <path d="M30 64 L40 88 L50 64" fill="#991b1b" opacity="0.5"/>
          <!-- left wing -->
          <path d="M22 38 Q 0 32, 0 50 Q 0 60, 18 56 Q 22 50, 22 38 Z" fill="url(#gWing)" stroke="#78350f" stroke-width="0.5"/>
          <path d="M4 40 Q 8 44, 8 48" stroke="#fffbeb" stroke-width="0.5" fill="none"/>
          <path d="M4 46 Q 8 50, 8 54" stroke="#fffbeb" stroke-width="0.5" fill="none"/>
          <!-- right wing -->
          <path d="M58 38 Q 80 32, 80 50 Q 80 60, 62 56 Q 58 50, 58 38 Z" fill="url(#gWing)" stroke="#78350f" stroke-width="0.5"/>
          <path d="M76 40 Q 72 44, 72 48" stroke="#fffbeb" stroke-width="0.5" fill="none"/>
          <path d="M76 46 Q 72 50, 72 54" stroke="#fffbeb" stroke-width="0.5" fill="none"/>
          <!-- hex body -->
          <path d="M40 2 L68 16 L68 50 L40 68 L12 50 L12 16 Z" fill="url(#gG)" stroke="#78350f" stroke-width="1.5"/>
          <!-- inner border -->
          <path d="M40 8 L62 20 L62 46 L40 60 L18 46 L18 20 Z" fill="none" stroke="#fef3c7" stroke-width="1" opacity="0.7"/>
          <!-- star -->
          <path d="M40 20 L44 30 L54 30 L46 37 L49 47 L40 40 L31 47 L34 37 L26 30 L36 30 Z" fill="url(#gStar)" stroke="#92400e" stroke-width="0.5"/>
        </svg>`;
      }

        "function symbol() view returns (string)",
        "function totalSupply() view returns (uint256)",
        "function balanceOf(address) view returns (uint256)",

      MockUSDT: [
        "function balanceOf(address) view returns (uint256)",

      Investment: [

    let state = {

    // ============================================================
    // Wallet
    // ============================================================
    async function connectWallet() {
      if (!window.ethereum) { alert("Please install MetaMask: https://metamask.io/download/"); return; }
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        state.account = accounts[0];
        state.provider = new ethers.BrowserProvider(window.ethereum);
        state.signer = await state.provider.getSigner();
        await checkNetwork();
        await checkDeployment();
        updateConnectButton();
        render();
        window.ethereum.on("accountsChanged", () => location.reload());
        window.ethereum.on("chainChanged", () => location.reload());
      } catch (e) { console.error(e); alert("Connection rejected: " + e.message); }
    }

    async function checkNetwork() {
      const net = await state.provider.getNetwork();
      state.chainOk = Number(net.chainId) === CONFIG.chainId;
    }

    async function checkDeployment() {
      try {
        const code = await state.provider.getCode(CONFIG.addresses.BCFToken);
        state.deployed = code && code !== "0x" && code.length > 2;
      } catch (e) { state.deployed = false; }
    }

    async function switchToBSC() {
      try {
        await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0x61" }] });
        location.reload();
      } catch (e) {
        if (e.code === 4902) {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [{ chainId: "0x61", chainName: "BSC Testnet", nativeCurrency: { name: "tBNB", symbol: "tBNB", decimals: 18 }, rpcUrls: [CONFIG.rpcUrl], blockExplorerUrls: [CONFIG.explorer] }],
          });
          location.reload();
        }
      }
    }

    function updateConnectButton() {
      const btn = document.getElementById("connectBtn");
      if (!btn) return;
      if (state.account) {
        btn.innerHTML = `<span>${state.account.slice(0, 6)}...${state.account.slice(-4)}</span> <span style="font-size:0.7em;margin-left:4px;">▾</span>`;
        btn.onclick = toggleAccountMenu;
      } else {
        btn.textContent = "Connect Wallet";
        btn.onclick = connectWallet;
      }
    }

      const menu = document.createElement("div");

      menu.style.cssText = `position:absolute;top:60px;right:24px;background:#1a1a1a;border:1px solid rgba(251,191,36,0.3);border-radius:12px;padding:14px;min-width:280px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.5);`;

          <span>📋</span><span>Copy Address</span>
        </button>
        <button class="account-menu-btn" data-action="explorer" style="display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;background:transparent;border:0;color:#fff;cursor:pointer;border-radius:6px;font-size:0.9rem;text-align:left;">
          <span>🔗</span><span>View on BSCScan</span>
        </button>
        <button class="account-menu-btn" data-action="switch" style="display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;background:transparent;border:0;color:#fff;cursor:pointer;border-radius:6px;font-size:0.9rem;text-align:left;">
          <span>🔄</span><span>${state.chainOk ? 'Switch Network' : 'Switch to BSC Testnet'}</span>
        </button>
        <div style="height:1px;background:rgba(255,255,255,0.1);margin:6px 0;"></div>
        <button class="account-menu-btn" data-action="disconnect" style="display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;background:transparent;border:0;color:#ef4444;cursor:pointer;border-radius:6px;font-size:0.9rem;text-align:left;font-weight:600;">
          <span>🚪</span><span>Disconnect</span>
        </button>
      `;
      document.body.appendChild(menu);
      // Bind menu buttons
      menu.querySelectorAll(".account-menu-btn").forEach(b => {
        b.addEventListener("mouseenter", () => b.style.background = "rgba(255,255,255,0.05)");
        b.addEventListener("mouseleave", () => b.style.background = "transparent");
        b.addEventListener("click", (ev) => handleAccountAction(ev.target.closest("button").dataset.action));
      });
      // Close on outside click
      setTimeout(() => {
        document.addEventListener("click", closeAccountMenu, { once: true });
      }, 100);
    }

    function closeAccountMenu() {
      const m = document.getElementById("accountMenu");
      if (m) m.remove();
    }

    async function handleAccountAction(action) {
      closeAccountMenu();
      if (action === "copy") {
        try {
          await navigator.clipboard.writeText(state.account);
          alert("Address copied:\n" + state.account);
        } catch (e) {
          alert("Copy failed: " + e.message);
        }
      } else if (action === "explorer") {
        window.open(`${CONFIG.explorer}/address/${state.account}`, "_blank");
      } else if (action === "switch") {
        await switchToBSC();
      } else if (action === "disconnect") {
        if (window.ethereum && window.ethereum.removeAllListeners) {
          // Just clear local state — MetaMask doesn't have a "disconnect" API
          // The user can also disconnect from MetaMask itself
        }
        state.account = null;
        state.provider = null;
        state.signer = null;
        state.chainOk = false;
        state.deployed = false;
        updateConnectButton();
        // Force re-render to clear all user-specific data
        render();
        alert("Disconnected locally.\n\n(Note: To fully disconnect, also click the MetaMask icon → Connected sites → Disconnect this site)");
      }
    }

    function getContract(name, withSigner = false) {
      if (!state.provider) return null;
      return new ethers.Contract(CONFIG.addresses[name], ABIS[name], withSigner ? state.signer : state.provider);
    }

    // ============================================================

    function fmt(n, dp = 2) {
      if (n === 0 || n === "0") return "0";
      const num = Number(n);
      if (isNaN(num)) return "—";
      if (Math.abs(num) >= 1e6) return (num / 1e6).toFixed(dp) + "M";
      if (Math.abs(num) >= 1e3) return (num / 1e3).toFixed(dp) + "k";
      return num.toFixed(dp);
    }
    function addrShort(a) { return a ? a.slice(0, 6) + "..." + a.slice(-4) : "—"; }

            </div>
            <div>
              <h3 style="color:var(--gold);text-align:center;font-size:1rem;padding-bottom:8px;border-bottom:2px solid var(--muted-2);margin-bottom:14px;color:var(--muted);">Redemption List</h3>
              <p style="color:var(--muted);text-align:center;padding:20px 0;">No redemptions yet</p>
            </div>
          </div>
        </div>
      `;
    }

    // ============================================================
    // Render
    // ============================================================
    async function render() {
      updateConnectButton();

      // Fetch live wallet balances (USDT + BCF) for dashboard display
      if (state.account && state.deployed && state.provider) {
        // Run async without blocking render
        (async () => {
          try {
            const usdtC = getContract("MockUSDT");
            const bcfC = getContract("BCFToken");
            const [usdtBal, bcfBal] = await Promise.all([
              usdtC.balanceOf(state.account).catch(() => 0n),
              bcfC.balanceOf(state.account).catch(() => 0n),
            ]);
            const usdtEl = document.getElementById("dashUsdtBal");
            const bcfEl = document.getElementById("dashBcfBal");
            if (usdtEl) usdtEl.innerHTML = Number(ethers.formatUnits(usdtBal, 18)).toLocaleString(undefined, { maximumFractionDigits: 2 });
            if (bcfEl) bcfEl.innerHTML = Number(ethers.formatUnits(bcfBal, 18)).toLocaleString(undefined, { maximumFractionDigits: 2 });
          } catch (e) { console.error("Balance fetch error:", e); }
        })();
        // Also fetch USDT balance for Redeem page
        setTimeout(() => {
          const usdtEl2 = document.getElementById("usdtBalance");
          if (usdtEl2) {
            const usdtC = getContract("MockUSDT");
            usdtC.balanceOf(state.account).then(bal => {
              usdtEl2.innerHTML = "$" + Number(ethers.formatUnits(bal, 18)).toLocaleString(undefined, { maximumFractionDigits: 2 });
            }).catch(() => {
              usdtEl2.innerHTML = "$0.00";
            });
          }
        }, 100);
      }
      const route = getRoute();
      document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.route === route));
      const app = document.getElementById("app");
      let content = "";
      if (route === "dashboard") content = renderDashboard();
      else if (route === "node") content = renderNode();
      else if (route === "redeem") content = renderRedeem();
      else if (route === "network") content = renderNetwork();
      else if (route === "account") content = renderAccount();
      else if (route === "insurance") content = renderInsurance();
      else content = renderDashboard();
      app.innerHTML = content;

      // bind handlers
      const switchLink = document.getElementById("switchNet");
      if (switchLink) switchLink.addEventListener("click", (e) => { e.preventDefault(); switchToBSC(); });

      document.querySelectorAll("[data-buy]").forEach(btn => {
        btn.addEventListener("click", () => go("redeem"));
      });

      // Dashboard — Claim / View Details
      const claimInsDash = document.getElementById("claimIns");
      if (claimInsDash) claimInsDash.addEventListener("click", () => {
        showModal(
          "Capital Protection",
          `<p style="color:#fff;font-size:0.95rem;margin-bottom:14px;font-weight:500;">Purchase BCF Tokens and Automatically Earn Profits Through Smart Contracts with 70% Capital Protection.</p>
          <p style="color:rgba(255,255,255,0.85);font-size:0.9rem;line-height:1.7;margin-bottom:18px;">
            ✓ Enjoy coverage up to 70% in early months<br>
            ✓ Claim protection anytime during plan period<br>
            ✓ Simple one-click activation
          </p>`,
          "ACTIVATE INSURANCE NOW",
          async () => {
            if (!state.deployed) { alert("Contracts not yet deployed on testnet."); return; }
            if (!state.account) { await connectWallet(); return; }
            try {
              const ins = getContract("Insurance", true);
              const tx = await ins.activate();
              alert("Insurance activation submitted! Tx: " + tx.hash);
            } catch (e) { alert("Activation failed: " + (e.reason || e.message)); }
          }
        );
      });
      const viewInsDash = document.getElementById("viewIns");
      if (viewInsDash) viewInsDash.addEventListener("click", () => {
        showInsuranceDetails();
      });

      // Owner — Mint 10,000 USDT (test)
      const mintUsdt = document.getElementById("mintUsdt");
      if (mintUsdt) mintUsdt.addEventListener("click", async () => {
        try {
          const usdt = getContract("MockUSDT", true);
          const amount = ethers.parseUnits("10000", 18);
          mintUsdt.textContent = "Minting...";
          mintUsdt.disabled = true;
          const tx = await usdt.mint(state.account, amount);
          await tx.wait();
          mintUsdt.textContent = "✓ Minted 10,000 USDT";
          alert("✅ Minted 10,000 USDT!\n\nTx: " + tx.hash + "\n\nYour balance is now updated.");
          setTimeout(() => { mintUsdt.textContent = "Mint 10,000 USDT"; mintUsdt.disabled = false; }, 3000);
          // Re-fetch balance
          render();
        } catch (e) {
          alert("Mint failed: " + (e.reason || e.message));
          mintUsdt.textContent = "Mint 10,000 USDT";
          mintUsdt.disabled = false;
        }
      });

      // Dashboard — Copy Address
      const copyAddrBtn = document.getElementById("copyAddrBtn");
      if (copyAddrBtn) copyAddrBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(state.account);
          copyAddrBtn.textContent = "✓ Copied!";
          setTimeout(() => copyAddrBtn.textContent = "📋 Copy Address", 2000);
        } catch (e) {
          alert("Copy failed: " + e.message);
        }
      });

      // Insurance page Claim / View Details
      const claimInsPage = document.querySelector(".stat-card #claimIns");
      if (claimInsPage) claimInsPage.addEventListener("click", () => {
        showModal(
          "Capital Protection",
          `<p style="color:#fff;font-size:0.95rem;margin-bottom:14px;font-weight:500;">Purchase BCF Tokens and Automatically Earn Profits Through Smart Contracts with 70% Capital Protection.</p>
          <p style="color:rgba(255,255,255,0.85);font-size:0.9rem;line-height:1.7;margin-bottom:18px;">
            ✓ Enjoy coverage up to 70% in early months<br>
            ✓ Claim protection anytime during plan period<br>
            ✓ Simple one-click activation
          </p>`,
          "ACTIVATE INSURANCE NOW",
          async () => {
            if (!state.deployed) { alert("Contracts not yet deployed on testnet."); return; }
            if (!state.account) { await connectWallet(); return; }
            try {
              const ins = getContract("Insurance", true);
              const tx = await ins.activate();
              alert("Insurance activation submitted! Tx: " + tx.hash);
            } catch (e) { alert("Activation failed: " + (e.reason || e.message)); }
          }
        );
      });
      const viewInsPage = document.querySelector(".stat-card #viewIns");
      if (viewInsPage) viewInsPage.addEventListener("click", () => showInsuranceDetails());

      // Node — View Reward History
      const viewHist = document.getElementById("viewRewardHistory");
      if (viewHist) viewHist.addEventListener("click", () => {
        showModal("Reward History", `
          <p style="text-align:center;color:var(--muted);padding:20px 0;">No reward history yet</p>
        `);
      });
      // Node — Claim Bonus
      const claimBonus = document.getElementById("claimBonus");
      if (claimBonus) claimBonus.addEventListener("click", () => {
        showModal("Monthly Bonus Claimed", "<p>You claimed <strong style='color:var(--gold);'>0 BCF</strong> as month 1 bonus.</p>");
      });
      // Node — Tier buy buttons
      document.querySelectorAll(".node-tier-buy").forEach(btn => {
        btn.addEventListener("click", () => {
          if (btn.textContent.trim() === "Purchased") return;
          showModal("Purchase Node", `<p>You are purchasing a <strong>${btn.dataset.tier} Node</strong>.</p><p style='color:var(--muted);margin-top:8px;'>In production, this triggers the smart contract buyNode() call with the matching USDT amount.</p>`);
        });
      });

      // Node — Purchase Node (BCF Partner) section
      const nodeSlider = document.getElementById("nodeAmount");
      if (nodeSlider) {
        nodeSlider.addEventListener("input", (e) => {
          _nodeAmount = Number(e.target.value);
          document.getElementById("nodeAmtLabel").textContent = _nodeAmount + " USDT";
          document.getElementById("nodeUsdtSplit").textContent = (_nodeAmount * 0.5).toFixed(0);
          document.getElementById("nodeCreditSplit").textContent = (_nodeAmount * 0.5).toFixed(0);
          document.getElementById("nodeShares").textContent = (_nodeAmount / 100).toFixed(0);
        });
        document.getElementById("purchaseNode").addEventListener("click", () => {
          showModal("BCF Partner Purchase", `<p>You are purchasing <strong>${_nodeAmount} USDT</strong> worth of node shares (${(_nodeAmount/100).toFixed(0)} shares).</p><p style='color:var(--muted);margin-top:8px;'>In production, this calls buyNode() on the Node contract.</p>`);
        });
      }

      // Network — Claim Rewards
      const claimRew = document.getElementById("claimRewards");
      if (claimRew) claimRew.addEventListener("click", () => {
        showModal("Rewards Claimed", "<p>You claimed <strong style='color:var(--gold);'>0 USDT</strong> in referral rewards.</p>");
      });

      // Redeem — pct buttons
      document.querySelectorAll("[data-pct]").forEach(btn => {
        btn.addEventListener("click", () => {
          const pct = Number(btn.dataset.pct);
          const amt = (74.96 * pct / 100).toFixed(2);
          const inp = document.getElementById("withdrawAmount");
          if (inp) inp.value = amt;
          document.querySelectorAll("[data-pct]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
        });
      });
      const wdraw = document.getElementById("withdrawBtn");
      if (wdraw) wdraw.addEventListener("click", () => {
        showModal("Withdraw", "<p>Withdraw transaction would be submitted to the smart contract.</p>");
      });

      // Network — copy
      const copyBtn = document.getElementById("copyRefLink");
      if (copyBtn) copyBtn.addEventListener("click", () => {
        const link = state.account ? `https://bcf-dapp.vercel.app/ref/${state.account}` : "https://bcf-dapp.vercel.app/ref/your-address";
        navigator.clipboard.writeText(link);
        copyBtn.textContent = "✓ Copied!";
        setTimeout(() => copyBtn.textContent = "Copy Referral Link", 2000);
      });
    }

    // Init
    document.getElementById("connectBtn").addEventListener("click", connectWallet);
    document.getElementById("menuBtn").addEventListener("click", () => {
      showModal("Menu", `
        <p style='color:var(--muted);margin-bottom:12px;'>Quick navigation</p>
        <div style='display:flex;flex-direction:column;gap:8px;'>
          <button class='btn-gold' onclick='location.hash="#/dashboard"'>Dashboard</button>
          <button class='btn-gold' onclick='location.hash="#/insurance"'>Capital Protection</button>
          <button class='btn-gold' onclick='location.hash="#/network"'>Network</button>
        </div>
      `);
    });
    document.querySelectorAll(".nav-item").forEach(b => {
      b.addEventListener("click", () => go(b.dataset.route));
    });
    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
